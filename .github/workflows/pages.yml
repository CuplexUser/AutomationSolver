name: Deploy GitHub Pages

on:
  # Deliberately unfiltered. This used to carry a `paths:` list, and in August
  # 2026 GitHub started recording pushes to main without ever creating a run
  # from them, while workflow_dispatch on the same file kept working. Deploying
  # on every push costs about a minute of free Actions time and removes the
  # failure mode. The site depends on packages/shared anyway (the demo compiles
  # the engine into itself), so most pushes here are site-relevant.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck the demo
        run: npm run typecheck -w @automationsolver/site
      - name: Build site
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
